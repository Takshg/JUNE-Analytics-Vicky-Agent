  legacy_price_per_seat: 39
  legacy_customers: 59
  annual_prepay_customers: 45
  onboarding_fee: "$1,200 one time for 10+ seats; larger accounts quoted"
  billing: Monthly by card or invoice; annual plans can only be cancelled at renewal.
