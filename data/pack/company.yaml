bookkeeping_policies:
  - Cost of revenue includes hosting, SMS and telephony, and card processing fees.
  - Customer success salaries are recorded in operating expenses, not cost of revenue.
  - SR&ED credits are recorded as other income in the month the cash arrives.
  - Annual plans are billed up front, recorded as deferred revenue and recognized monthly.
  - Onboarding fees are recognized in the month the customer signs.
  - Salaries are loaded costs (pay plus payroll taxes and benefits).
  - No pipeline data; the company does not track its sales pipeline in a CRM.
founders_worry: "We know the product. We don't know what a seed investor will ask in the first ten minutes, and we don't want to be caught out on our own numbers."
missing_data:
  - Sales pipeline / CRM deal data
  - Win/loss reasons and competitor data
  - Bottom-up market sizing (TAM)
  - Customer-level files (05_customers.csv, 06_seats_by_customer_by_month.csv) needed to recompute cohort NRR, GRR, cohort churn and rep ramp
  - Monthly balance sheet and cash flow (only quarterly summaries available)
