name: Tidewell Systems Inc.
hq: Toronto, Ontario, Canada
incorporated: 2024-01
fiscal_year_end: December 31
product: >-
  Tidewell Dispatch, scheduling and dispatch software for trades businesses with 3 to 30
  field technicians (HVAC, plumbing, electrical, landscaping, pest control, appliance repair).
  Job booking, technician routing, quotes, invoices and automatic customer text messages.
